<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Usuários — GestãoNF</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;min-height:100vh}
.bar{background:#0854a0;color:#fff;padding:12px 20px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.bar b{font-size:15px}
.btn{padding:7px 16px;border-radius:4px;border:1px solid;font-size:13px;font-weight:700;cursor:pointer;font-family:Arial}
.btn-primary{background:#0854a0;color:#fff;border-color:#0854a0}
.btn-primary:hover{background:#064080}
.btn-danger{background:#fff;color:#bb0000;border-color:#bb0000}
.btn-danger:hover{background:#fff1f1}
.btn-sm{padding:3px 10px;font-size:11px}
.btn-logout{background:rgba(255,255,255,.2);color:#fff;border-color:rgba(255,255,255,.4);font-size:12px;padding:4px 12px}
.wrap{max-width:960px;margin:20px auto;padding:0 16px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid #d9d9d9;border-radius:4px;overflow:hidden}
.card-hdr{background:linear-gradient(#f2f2f2,#e8e8e8);border-bottom:1px solid #d9d9d9;padding:9px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#666;letter-spacing:.4px;margin-bottom:4px}
.field input,.field select{width:100%;padding:7px 10px;border:1px solid #bbb;border-radius:4px;font-size:13px;font-family:Arial;outline:none}
.field input:focus,.field select:focus{border-color:#0854a0}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.chk input{width:15px;height:15px}
.msg{padding:8px 12px;border-radius:4px;font-size:12px;margin-top:8px;display:none}
.msg.ok{background:#f1fdf6;color:#107e3e;border:1px solid #a9d5b5;display:block}
.msg.err{background:#fff1f1;color:#bb0000;border:1px solid #f5b3b3;display:block}
.tbl-row{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid #eee;font-size:12px}
.tbl-row:last-child{border-bottom:none}
.tbl-row:hover{background:#f8fbff}
.tbl-hdr{background:#f2f2f2;font-weight:700;font-size:11px;text-transform:uppercase;color:#666;border-bottom:2px solid #ccc}
.badge{background:#e4f0fb;color:#0854a0;border:1px solid #a4caee;font-size:10px;font-weight:700;padding:2px 7px;border-radius:3px}
.empty{text-align:center;padding:30px;color:#999;font-size:13px}
.login-box{background:#fff;border:1px solid #d9d9d9;border-radius:4px;padding:32px;max-width:380px;margin:60px auto;box-shadow:0 4px 20px rgba(0,0,0,.1);text-align:center}
.login-box h2{color:#0854a0;margin-bottom:6px}
.login-box p{color:#666;font-size:12px;margin-bottom:20px}
.login-inp{width:100%;padding:9px 12px;border:1px solid #ccc;border-radius:4px;font-size:13px;font-family:Arial;margin-bottom:10px;outline:none}
.login-inp:focus{border-color:#0854a0}
</style>
</head>
<body>

<div class="bar">
  <b>⚙ Gestão de Usuários — GestãoNF</b>
  <span id="bar-info">
    <button class="btn btn-logout" id="btn-logout" onclick="auth.signOut()" style="display:none">Sair</button>
  </span>
</div>

<!-- LOGIN -->
<div id="login-div">
  <div class="login-box">
    <h2>🔐 Login</h2>
    <p>Acesso restrito aos owners do sistema</p>
    <input class="login-inp" id="l-email" type="email" placeholder="E-mail">
    <input class="login-inp" id="l-senha" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter')login()">
    <button class="btn btn-primary" onclick="login()" style="width:100%;padding:10px">Entrar</button>
    <div class="msg" id="l-msg"></div>
  </div>
</div>

<!-- APP -->
<div id="app-div" style="display:none">
<div class="wrap">

  <!-- FORM -->
  <div class="card">
    <div class="card-hdr">👤 <span id="form-title">Cadastrar Usuário</span></div>
    <div class="card-body">
      <input type="hidden" id="edit-key">
      <div class="grid2">
        <div class="field"><label>Nome</label><input id="f-nome" placeholder="Nome"></div>
        <div class="field"><label>Sobrenome</label><input id="f-sobre" placeholder="Sobrenome"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>E-mail (login)</label><input id="f-email" type="email" placeholder="usuario@empresa.com.br"></div>
        <div class="field"><label>Usuário SAP</label><input id="f-sap" placeholder="Ex: JSILVA"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Departamento</label><input id="f-area" placeholder="Ex: PCM, Captação..."></div>
        <div class="field"><label>Etapa (fluxo NF)</label>
          <select id="f-etapa">
            <option value="">Selecione...</option>
            <option>Suprimentos</option>
            <option>MIGO</option>
            <option>MIRO</option>
            <option>CAP</option>
          </select>
        </div>
      </div>
      <div class="chk">
        <input type="checkbox" id="f-admin">
        <label for="f-admin" style="font-size:13px;cursor:pointer">Admin do Departamento</label>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" id="btn-salvar" onclick="salvar()">+ Cadastrar</button>
        <button class="btn" id="btn-cancelar" onclick="cancelarEdicao()" style="display:none">Cancelar</button>
      </div>
      <div class="msg" id="f-msg"></div>
    </div>
  </div>

  <!-- LIST -->
  <div class="card">
    <div class="card-hdr">
      👥 Usuários Cadastrados
      <span id="f-count" style="font-size:11px;color:#888;font-weight:400">0 registros</span>
    </div>
    <div id="f-list"><div class="empty">Carregando...</div></div>
  </div>

</div>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBaWlNBg1pWe8sMSKbZGdWWPLHZWET8890",
  authDomain:"danfelproject.firebaseapp.com",
  databaseURL:"https://danfelproject-default-rtdb.firebaseio.com",
  projectId:"danfelproject",
  storageBucket:"danfelproject.firebasestorage.app",
  messagingSenderId:"474832580279",
  appId:"1:474832580279:web:61055352610d4f1a03a732"
});
const auth = firebase.auth();
const db   = firebase.database();
const OWNERS = ['danfelpiphone@gmail.com','danfelpiphone@gamil.com','daniel.jorge@mills.com.br'];

// ── AUTH ──
function login(){
  const email = document.getElementById('l-email').value.trim();
  const senha = document.getElementById('l-senha').value;
  if(!email||!senha){msg('l-msg','Preencha e-mail e senha.','err');return;}
  auth.signInWithEmailAndPassword(email,senha).catch(e=>{
    msg('l-msg',{'auth/wrong-password':'Senha incorreta.','auth/user-not-found':'Usuário não encontrado.','auth/invalid-credential':'E-mail ou senha incorretos.'}[e.code]||e.message,'err');
  });
}

auth.onAuthStateChanged(u=>{
  if(u && OWNERS.some(o=>o.toLowerCase()===u.email.toLowerCase())){
    document.getElementById('login-div').style.display='none';
    document.getElementById('app-div').style.display='block';
    document.getElementById('btn-logout').style.display='';
    document.getElementById('bar-info').prepend(Object.assign(document.createElement('span'),{textContent:'Logado: '+u.email+'  ',style:'margin-right:8px'}));
    carregar();
  } else if(u){
    auth.signOut();
    msg('l-msg','Acesso negado.','err');
  } else {
    document.getElementById('login-div').style.display='block';
    document.getElementById('app-div').style.display='none';
  }
});

// ── HELPERS ──
function msg(id,txt,tipo){const e=document.getElementById(id);e.textContent=txt;e.className='msg '+(tipo||'ok');}
function emailKey(email){return 'func_'+email.replace('@','_at_').replace(/\./g,'_').replace(/-/g,'_');}
function limparForm(){
  ['f-nome','f-sobre','f-email','f-sap','f-area'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-etapa').value='';
  document.getElementById('f-admin').checked=false;
  document.getElementById('edit-key').value='';
  document.getElementById('form-title').textContent='Cadastrar Usuário';
  document.getElementById('btn-salvar').textContent='+ Cadastrar';
  document.getElementById('btn-cancelar').style.display='none';
  document.getElementById('f-msg').className='msg';
}

// ── SALVAR (cadastro e edição) ──
function salvar(){
  const nome  = document.getElementById('f-nome').value.trim();
  const sobre = document.getElementById('f-sobre').value.trim();
  const email = document.getElementById('f-email').value.trim().toLowerCase();
  const sap   = document.getElementById('f-sap').value.trim().toUpperCase();
  const area  = document.getElementById('f-area').value.trim();
  const etapa = document.getElementById('f-etapa').value;
  const admin = document.getElementById('f-admin').checked;
  const editKey = document.getElementById('edit-key').value;

  if(!nome){msg('f-msg','Informe o nome.','err');return;}
  if(!email||!email.includes('@')){msg('f-msg','Informe um e-mail válido.','err');return;}

  const key  = editKey || emailKey(email);
  const func = {
    id: Date.now(),
    nome: (nome+' '+sobre).trim(),
    nome1: nome,
    sobrenome: sobre,
    email, usuarioSAP: sap,
    area, etapa, cargo:'', admin
  };

  db.ref('funcionarios/'+key).set(func)
    .then(()=>{
      msg('f-msg', (editKey?'Atualizado':'Cadastrado')+': '+func.nome,'ok');
      limparForm();
      carregar();
    })
    .catch(e=>msg('f-msg','Erro ao salvar: '+e.message,'err'));
}

// ── EDITAR ──
function editar(key){
  db.ref('funcionarios/'+key).once('value').then(snap=>{
    const f = snap.val();
    if(!f){alert('Usuário não encontrado.');return;}
    document.getElementById('f-nome').value   = f.nome1||f.nome.split(' ')[0];
    document.getElementById('f-sobre').value  = f.sobrenome||f.nome.split(' ').slice(1).join(' ');
    document.getElementById('f-email').value  = f.email||'';
    document.getElementById('f-sap').value    = f.usuarioSAP||'';
    document.getElementById('f-area').value   = f.area||'';
    document.getElementById('f-etapa').value  = f.etapa||'';
    document.getElementById('f-admin').checked= !!f.admin;
    document.getElementById('edit-key').value = key;
    document.getElementById('form-title').textContent = 'Editando: '+f.nome;
    document.getElementById('btn-salvar').textContent = '💾 Salvar Alterações';
    document.getElementById('btn-cancelar').style.display='';
    window.scrollTo(0,0);
  });
}

function cancelarEdicao(){ limparForm(); }

// ── EXCLUIR ──
function excluir(key,nome){
  if(!confirm('Remover '+nome+'?')) return;
  db.ref('funcionarios/'+key).remove()
    .then(()=>carregar())
    .catch(e=>alert('Erro: '+e.message));
}

// ── CARREGAR LISTA ──
function carregar(){
  db.ref('funcionarios').once('value').then(snap=>{
    const data = snap.val()||{};
    const lista = Object.entries(data)
      .filter(([k,f])=> f && f.email && f.nome)
      .sort(([,a],[,b])=>(a.nome||'').localeCompare(b.nome||''));

    document.getElementById('f-count').textContent = lista.length+' registro'+(lista.length!==1?'s':'');
    const el = document.getElementById('f-list');

    if(!lista.length){el.innerHTML='<div class="empty">Nenhum usuário cadastrado.</div>';return;}

    const hdr = '<div class="tbl-row tbl-hdr">'+
      '<span style="flex:1">Nome / E-mail</span>'+
      '<span style="width:110px">SAP</span>'+
      '<span style="width:100px">Etapa</span>'+
      '<span style="width:130px">Departamento</span>'+
      '<span style="width:55px">Admin</span>'+
      '<span style="width:100px">Ações</span>'+
    '</div>';

    el.innerHTML = hdr + lista.map(([key,f])=>
      '<div class="tbl-row">'+
        '<span style="flex:1"><strong>'+f.nome+'</strong><br><span style="color:#999;font-size:11px">'+f.email+'</span></span>'+
        '<span style="width:110px;font-family:monospace;font-size:11px;color:#0854a0">'+(f.usuarioSAP||'—')+'</span>'+
        '<span style="width:100px"><span class="badge">'+(f.etapa||'—')+'</span></span>'+
        '<span style="width:130px;font-size:11px">'+(f.area||'—')+'</span>'+
        '<span style="width:55px;font-size:11px">'+(f.admin?'✅':'—')+'</span>'+
        '<span style="width:100px;display:flex;gap:4px">'+
          '<button class="btn btn-primary btn-sm" onclick="editar(\''+key+'\')">✏ Editar</button>'+
          '<button class="btn btn-danger btn-sm" onclick="excluir(\''+key+'\',\''+f.nome+'\')">✕</button>'+
        '</span>'+
      '</div>'
    ).join('');
  });
}

// Live sync
db.ref('funcionarios').on('value', ()=>{ if(document.getElementById('app-div').style.display!=='none') carregar(); });
</script>
</body>
</html>
